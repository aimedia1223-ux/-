<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>パスワードの設定・再設定 | Connexy</title>
    <style>
      * { box-sizing: border-box; } body { margin: 0; background: #f1f5f9; color: #172033; font: 16px/1.7 system-ui,sans-serif; }
      main { max-width: 460px; margin: 8vh auto; padding: 28px; background: white; border-radius: 16px; box-shadow: 0 8px 32px #14233c12; }
      h1 { font-size: 23px; } .brand { color: #0563dc; font-weight: 750; } label { display: block; margin-top: 18px; font-weight: 600; }
      input,button { font: inherit; width: 100%; padding: 12px; border-radius: 8px; } input { margin-top: 5px; border: 1px solid #b9c6d6; }
      button { margin-top: 22px; border: 0; background: #0865e8; color: white; cursor: pointer; font-weight: 700; }
      button:disabled { opacity: .5; cursor: wait; } [hidden] { display: none !important; } a { color: #075dc5; } .note { color: #54657a; font-size: 14px; }
      #status { overflow-wrap: anywhere; } #status[data-error="true"] { color: #a22b1d; }
      @media (max-width: 500px) { main { margin: 24px 14px; padding: 24px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">connexy</div>
      <h1>パスワードの設定・再設定</h1>
      <p id="status" role="status" aria-live="polite">読み込み中…</p>
      <form id="request-form" hidden>
        <p class="note">登録済みのメールアドレスに、パスワード設定用リンクを送ります。</p>
        <label for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="email" required />
        <button type="submit">設定用メールを送信</button>
      </form>
      <form id="password-form" hidden>
        <p class="note">設定するアカウント：<strong id="account"></strong></p>
        <label for="new-password">新しいパスワード（12文字以上）</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="12" required />
        <label for="confirm-password">新しいパスワード（確認）</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required />
        <button type="submit">パスワードを設定</button>
      </form>
      <p><a href="./#/login">ログイン画面へ戻る</a></p>
      <noscript>この画面の利用にはJavaScriptが必要です。</noscript>
    </main>
    <script type="module" src="/src/passwordReset.ts"></script>
  </body>
</html>
