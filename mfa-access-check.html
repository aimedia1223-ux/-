<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex" />
  <title>追加認証前のアクセス確認 | Connexy</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; background: #f1f5f9; color: #172033; font: 16px/1.7 system-ui,sans-serif; }
    main { max-width: 600px; margin: 40px auto; padding: 28px; background: white; border-radius: 16px; }
    h1 { font-size: 23px; } label { display: block; margin-top: 16px; } input,button { font: inherit; width: 100%; padding: 12px; border-radius: 8px; }
    input { border: 1px solid #b9c6d6; } button { margin-top: 24px; border: 0; background: #0865e8; color: white; cursor: pointer; }
    button:disabled { opacity: .5; } [hidden] { display: none !important; } a { color: #075dc5; }
    .pass { color: #146331; } .fail { color: #b91c1c; }
    @media(max-width: 620px) { main { margin: 16px; padding: 20px; } }
  </style>
</head>
<body><main>
  <h1>追加認証前のアクセス確認</h1>
  <p>Cアカウントのパスワードだけで、業務データが取得できないか確認します。認証アプリのコードは使用しません。</p>
  <p>この画面の認証情報は保存せず、検証後に専用のログイン状態を終了します。</p>
  <form id="probe-form" hidden>
    <label for="email">Cアカウントのメールアドレス</label>
    <input id="email" type="email" autocomplete="off" required />
    <label for="password">Cアカウントのパスワード</label>
    <input id="password" type="password" autocomplete="off" required />
    <button type="submit">アクセス制限を確認する</button>
  </form>
  <p id="status" role="status" aria-live="polite">準備中…</p>
  <ul id="results"></ul>
  <p><a href="./#/">Connexyへ戻る</a></p>
</main><script type="module" src="/src/mfaAccessCheck.ts"></script></body>
</html>
